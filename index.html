<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O/X 퀴즈 게임</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }
        .fade-in {
            animation: fadeIn 0.4s ease-in-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .hidden-screen {
            display: none !important;
        }
        .btn-press {
            transition: transform 0.1s;
        }
        .btn-press:active {
            transform: scale(0.95);
        }
        #fireworks { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
        #result-title { overflow-wrap: anywhere; }
        @media (prefers-reduced-motion: reduce) { .fade-in { animation: none; } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <canvas id="fireworks" aria-hidden="true"></canvas>
    <!-- 메인 컨테이너 -->
    <div class="bg-white w-full max-w-md rounded-2xl shadow-xl overflow-hidden relative min-h-[400px] flex flex-col border-t-8 border-yellow-400">
        
        <!-- 시작 화면 -->
        <div id="start-screen" class="flex-1 flex flex-col items-center justify-center p-8 text-center fade-in">
            <div class="text-5xl mb-4">🤖</div>
            <h1 class="text-2xl font-bold text-gray-800 mb-2 break-keep">영재교육 & 핑퐁로봇<br>퀴즈 챌린지</h1>
            <p class="text-gray-500 mb-4 text-sm">로봇과 영재교육에 대한 퀴즈를 풀어보세요!<br>총 5문제가 랜덤으로 출제됩니다.</p>
            
            <!-- 공유 영역: QR 코드 및 링크 -->
            <div class="bg-gray-50 rounded-xl p-4 w-full mb-6 flex flex-col items-center border border-gray-200">
                <p class="text-xs font-semibold text-gray-500 mb-3">모바일로 접속하기</p>
                <img id="qr-code-img" alt="QR Code" class="w-32 h-32 mb-3 bg-white p-1 border rounded shadow-sm">
                <div class="flex items-center w-full bg-white border rounded-lg px-3 py-2 shadow-inner">
                    <input type="text" id="share-link-input" readonly class="text-xs text-gray-600 bg-transparent w-full outline-none" value="">
                    <button onclick="copyLink()" class="ml-2 text-blue-600 hover:text-blue-800 text-xs font-bold whitespace-nowrap bg-blue-50 px-2 py-1 rounded">복사</button>
                </div>
                <p id="copy-msg" class="text-xs text-green-600 mt-2 font-bold opacity-0 transition-opacity duration-300">클립보드에 복사되었습니다!</p>
            </div>

            <form id="entry-form" class="w-full text-left">
                <label for="student-name" class="block text-sm font-bold text-gray-700 mb-2">이름을 입력해 주세요</label>
                <input id="student-name" name="student-name" type="text" maxlength="30" required autocomplete="off" placeholder="예: 김영재"
                    class="w-full border border-gray-300 rounded-xl px-4 py-3 mb-2 text-lg focus:outline-none focus:ring-2 focus:ring-blue-500" aria-describedby="name-error">
                <p id="name-error" role="alert" class="text-sm text-red-600 mb-3 min-h-[20px]"></p>
            <button type="submit" class="btn-press w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-6 rounded-xl shadow-md text-lg mt-auto">
                게임 시작
            </button>
            </form>
        </div>

        <!-- 퀴즈 화면 -->
        <div id="quiz-screen" class="hidden-screen flex-1 flex flex-col p-6 fade-in">
            <div class="flex justify-between items-center mb-6">
                <span class="bg-blue-100 text-blue-800 text-sm font-semibold px-3 py-1 rounded-full" id="progress-text">1 / 5</span>
                <span class="text-gray-500 text-sm font-semibold">점수: <span id="score-text">0</span></span>
            </div>
            
            <div class="flex-1 flex items-center justify-center mb-8">
                <h2 id="question-text" class="text-xl font-bold text-gray-800 text-center leading-relaxed break-keep">
                    <!-- 질문이 여기에 표시됩니다 -->
                </h2>
            </div>

            <!-- 피드백 메시지 (정답/오답) -->
            <div id="feedback-container" class="h-8 flex items-center justify-center mb-4 opacity-0 transition-opacity duration-300">
                <p id="feedback-text" class="text-lg font-bold"></p>
            </div>

            <div class="flex space-x-4">
                <button id="btn-o" onclick="selectAnswer(true)" class="btn-press flex-1 bg-blue-500 hover:bg-blue-600 text-white text-6xl font-bold py-8 rounded-2xl shadow-md flex items-center justify-center transition-colors">
                    O
                </button>
                <button id="btn-x" onclick="selectAnswer(false)" class="btn-press flex-1 bg-red-500 hover:bg-red-600 text-white text-6xl font-bold py-8 rounded-2xl shadow-md flex items-center justify-center transition-colors">
                    X
                </button>
            </div>
        </div>

        <!-- 결과 화면 -->
        <div id="result-screen" class="hidden-screen flex-1 flex flex-col items-center justify-center p-8 text-center fade-in">
            <div id="result-icon" class="text-6xl mb-4">🎉</div>
            <h1 id="result-title" class="text-3xl font-bold text-blue-700 mb-3 leading-snug" aria-live="polite"></h1>
            <p id="result-subtitle" class="text-gray-500 mb-6"></p>
            
            <div class="bg-blue-50 rounded-2xl p-6 w-full mb-8 border border-blue-100">
                <p class="text-4xl font-extrabold text-blue-600">
                    <span id="final-score">0</span><span class="text-2xl text-gray-600"> / 5점</span>
                </p>
                <p id="result-message" class="text-gray-700 mt-2 font-semibold"></p>
            </div>

            <button onclick="resetGame()" class="btn-press w-full bg-yellow-400 hover:bg-yellow-500 text-gray-900 font-bold py-4 px-6 rounded-xl shadow-md text-lg">
                다시 하기
            </button>
        </div>
        
    </div>

    <script>
        // 퀴즈 데이터 풀 (15문항)
        const allQuestions = [
            { text: "G큐브 핑퐁로봇은 큐브를 더할수록 다양한 로봇 모델을 만들 수 있다.", answer: true },
            { text: "핑퐁로봇의 G큐브는 조립 공구 없이 링크를 끼워 1분 만에 조립할 수 있다.", answer: true },
            { text: "G큐브 1개로 만들 수 있는 로봇 모델의 이름은 앤트봇이다.", answer: false },
            { text: "G큐브에는 소리와 빛을 내는 부저와 칼라 LED가 내장되어 있다.", answer: true },
            { text: "핑퐁로봇은 오직 전용 앱으로만 조종할 수 있으며, 스크래치나 파이썬 등과는 연동되지 않는다.", answer: false },
            { text: "'라인봇' 미션은 바닥의 선을 따라가며 컬러 센서로 색을 읽어 방향을 바꾸는 원리를 이용한다.", answer: true },
            { text: "라인봇 수학 미션에서 로봇의 출발점은 초록색, 도착점은 주황색이다.", answer: false },
            { text: "드로잉봇으로 정다각형을 그릴 때, 삼각형을 그리려면 꼭짓점에서 로봇이 120도 돌아야 한다.", answer: true },
            { text: "오일러의 한 붓 그리기 규칙에 따르면, 선이 홀수 개 모인 점이 0개 또는 2개일 때 한 붓 그리기가 가능하다.", answer: true },
            { text: "배틀봇 사탕 쟁탈전은 정해진 시간 1분 동안 사탕을 밀어서 상대방 진영에 많이 넣으면 승리한다.", answer: false },
            { text: "부산광역시교육청영재교육진흥원의 비전은 '대한민국 영재교육의 중심 플랫폼'이다.", answer: true },
            { text: "영재교육진흥원의 3대 전략은 연구, 연수, 그리고 교육지원이다.", answer: true },
            { text: "초·중학생을 대상으로 문제 발견에서 해결까지 탐구하는 캠프의 이름은 상상실현(I&D) 캠프이다.", answer: true },
            { text: "영재교육진흥원은 교사들의 전문성을 높이기 위해 기초, 심화, 전문 연수 등 다양한 연수 프로그램을 운영한다.", answer: true },
            { text: "R&E 페스타는 학생들의 새로운 아이디어를 탐구 단계의 연구로 처음 연결해주는 캠프이다.", answer: false }
        ];

        let audioContext = null;
        let studentName = '';
        let stopFireworks = () => {};
        let selectedQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let isProcessing = false; // 중복 클릭 방지 플래그

        // DOM 요소
        const screens = {
            start: document.getElementById('start-screen'),
            quiz: document.getElementById('quiz-screen'),
            result: document.getElementById('result-screen')
        };
        
        const ui = {
            questionText: document.getElementById('question-text'),
            progressText: document.getElementById('progress-text'),
            scoreText: document.getElementById('score-text'),
            finalScore: document.getElementById('final-score'),
            resultMessage: document.getElementById('result-message'),
            feedbackContainer: document.getElementById('feedback-container'),
            feedbackText: document.getElementById('feedback-text'),
            btnO: document.getElementById('btn-o'),
            btnX: document.getElementById('btn-x'),
            resultIcon: document.getElementById('result-icon'),
            qrCodeImg: document.getElementById('qr-code-img'),
            shareLinkInput: document.getElementById('share-link-input'),
            copyMsg: document.getElementById('copy-msg')
        };

        const nameInput = document.getElementById('student-name');
        const nameError = document.getElementById('name-error');
        document.getElementById('entry-form').addEventListener('submit', event => {
            event.preventDefault();
            startGame();
        });
        nameInput.addEventListener('input', () => { nameError.textContent = ''; });

        // 초기화: QR 코드 및 URL 설정
        window.onload = function() {
            const currentUrl = window.location.href;
            
            // qrserver API를 사용해 QR 코드 이미지 로드
            const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(currentUrl)}`;
            ui.qrCodeImg.src = qrApiUrl;

            // 공유 링크 인풋 설정
            ui.shareLinkInput.value = currentUrl;
        };

        // 공유 링크 복사 함수
        function copyLink() {
            ui.shareLinkInput.select();
            ui.shareLinkInput.setSelectionRange(0, 99999); // 모바일 기기 호환성

            try {
                document.execCommand('copy');
                ui.copyMsg.style.opacity = '1';
                setTimeout(() => {
                    ui.copyMsg.style.opacity = '0';
                }, 2000);
            } catch (err) {
                console.error('링크 복사에 실패했습니다.', err);
            }
        }

        // 배열 셔플 함수 (Fisher-Yates)
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [
                    array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // 화면 전환 함수
        function showScreen(screenName) {
            Object.values(screens).forEach(screen => {
                screen.classList.add('hidden-screen');
                screen.classList.remove('fade-in'); // 애니메이션 리셋
            });
            screens[screenName].classList.remove('hidden-screen');
            // 리플로우 강제 유발 후 애니메이션 클래스 추가
            void screens[screenName].offsetWidth;
            screens[screenName].classList.add('fade-in');
        }

        // 게임 시작
        function startGame() {
            const enteredName = nameInput.value.trim();
            if (!enteredName) {
                nameError.textContent = '이름을 입력한 뒤 게임을 시작해 주세요.';
                nameInput.focus();
                return;
            }
            prepareAudio();
            studentName = enteredName;
            stopFireworks();
            // 15문제 중 랜덤하게 5문제 추출
            const shuffled = shuffle([...allQuestions]);
            selectedQuestions = shuffled.slice(0, 5);
            
            currentIndex = 0;
            score = 0;
            isProcessing = false;
            
            ui.scoreText.innerText = score;
            
            loadQuestion();
            showScreen('quiz');
        }

        // 문제 로드
        function loadQuestion() {
            const currentQ = selectedQuestions[currentIndex];
            ui.questionText.innerText = currentQ.text;
            ui.progressText.innerText = `${currentIndex + 1} / 5`;
            
            // 피드백 초기화 및 버튼 활성화
            ui.feedbackContainer.style.opacity = '0';
            ui.btnO.disabled = false;
            ui.btnX.disabled = false;
            ui.btnO.classList.remove('opacity-50');
            ui.btnX.classList.remove('opacity-50');
        }

        // 정답 선택 처리
        function selectAnswer(userAnswer) {
            if (isProcessing) return; // 이미 처리중이면 무시
            isProcessing = true;

            const currentQ = selectedQuestions[currentIndex];
            const isCorrect = (userAnswer === currentQ.answer);

            // 버튼 시각적 비활성화
            ui.btnO.disabled = true;
            ui.btnX.disabled = true;
            if (userAnswer) ui.btnX.classList.add('opacity-50');
            else ui.btnO.classList.add('opacity-50');

            // 피드백 표시
            if (isCorrect) {
                score++;
                ui.scoreText.innerText = score;
                ui.feedbackText.innerText = "✅ 정답입니다!";
                ui.feedbackText.className = "text-xl font-bold text-green-600";
            } else {
                ui.feedbackText.innerText = "❌ 틀렸습니다!";
                ui.feedbackText.className = "text-xl font-bold text-red-600";
            }
            ui.feedbackContainer.style.opacity = '1';

            // 1초 후 다음 문제 또는 결과 화면으로 이동
            setTimeout(() => {
                currentIndex++;
                if (currentIndex < selectedQuestions.length) {
                    // 다음 문제 렌더링 시 페이드 효과를 위해 컨테이너 애니메이션 재적용
                    screens.quiz.classList.remove('fade-in');
                    void screens.quiz.offsetWidth; 
                    screens.quiz.classList.add('fade-in');
                    
                    loadQuestion();
                    isProcessing = false;
                } else {
                    showResult();
                }
            }, 1200);
        }

        // 결과 화면 표시
        function showResult() {
            ui.finalScore.innerText = score;
            const passed = score === selectedQuestions.length && selectedQuestions.length === 5;
            const title = document.getElementById('result-title');
            title.textContent = passed
                ? `${studentName}님, 합격하셨습니다!`
                : `${studentName}님, 다시 도전해 주세요.`;
            title.classList.toggle('text-blue-700', passed);
            title.classList.toggle('text-orange-600', !passed);
            document.getElementById('result-subtitle').textContent = passed
                ? '축하합니다! 5문제를 모두 맞혔어요!'
                : '5문제를 모두 맞히면 합격할 수 있어요!';
            ui.resultIcon.innerText = passed ? '🏆' : '💨';
            ui.resultMessage.innerText = passed
                ? '완벽해요! 모든 문제를 맞혔어요.'
                : `${selectedQuestions.length - score}문제가 아쉬웠어요. 다시 도전해 봐요!`;
            showScreen('result');
            if (passed) launchFireworks();
            else {
                stopFireworks();
                playFartSound();
            }
        }

        // 시작 버튼을 누를 때 오디오를 준비해 모바일에서도 효과음을 재생합니다.
        function prepareAudio() {
            try {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (!AudioContextClass) return;
                if (!audioContext) audioContext = new AudioContextClass();
                if (audioContext.state === 'suspended') audioContext.resume().catch(() => {});
            } catch (_) { /* 소리를 지원하지 않아도 퀴즈는 계속 진행합니다. */ }
        }

        // 짧고 우스꽝스러운 방귀 효과음: 낮은 진동음과 공기 소리를 합성합니다.
        function playFartSound() {
            try {
                if (!audioContext || audioContext.state !== 'running') return;
                const ctx = audioContext, now = ctx.currentTime, duration = 0.75;
                const oscillator = ctx.createOscillator();
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(110, now);
                oscillator.frequency.exponentialRampToValueAtTime(38, now + duration);
                const wobble = ctx.createOscillator(), wobbleGain = ctx.createGain();
                wobble.frequency.value = 28; wobbleGain.gain.value = 22;
                wobble.connect(wobbleGain); wobbleGain.connect(oscillator.frequency);
                const noise = ctx.createBufferSource();
                const buffer = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * duration), ctx.sampleRate);
                const samples = buffer.getChannelData(0);
                for (let i = 0; i < samples.length; i++) samples[i] = (Math.random() * 2 - 1) * 0.22;
                noise.buffer = buffer;
                const filter = ctx.createBiquadFilter();
                filter.type = 'lowpass'; filter.frequency.value = 500;
                const gain = ctx.createGain();
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.22, now + 0.04);
                gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
                oscillator.connect(filter); noise.connect(filter);
                filter.connect(gain); gain.connect(ctx.destination);
                oscillator.start(now); noise.start(now); wobble.start(now);
                oscillator.stop(now + duration); noise.stop(now + duration); wobble.stop(now + duration);
                oscillator.onended = () => {
                    oscillator.disconnect(); noise.disconnect(); wobble.disconnect();
                    wobbleGain.disconnect(); filter.disconnect(); gain.disconnect();
                };
            } catch (_) { /* 오디오 재생 실패가 결과 표시를 막지 않게 합니다. */ }
        }

        // 게임 다시 시작
        function resetGame() {
            stopFireworks();
            studentName = '';
            nameInput.value = '';
            nameError.textContent = '';
            showScreen('start');
            nameInput.focus();
        }

        // 외부 라이브러리 없이 색색의 불꽃과 꽃가루를 표시합니다.
        function launchFireworks() {
            stopFireworks();
            const canvas = document.getElementById('fireworks');
            const ctx = canvas.getContext('2d');
            if (!ctx) return;
            const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            let width, height, frame, particles = [], lastBurst = -1000;
            const colors = ['#fbbf24', '#3b82f6', '#f472b6', '#34d399', '#a78bfa', '#fb7185'];
            function resize() {
                width = window.innerWidth; height = window.innerHeight;
                const ratio = Math.min(window.devicePixelRatio || 1, 2);
                canvas.width = width * ratio; canvas.height = height * ratio;
                ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
            }
            resize();
            window.addEventListener('resize', resize);
            stopFireworks = () => {
                cancelAnimationFrame(frame);
                particles = [];
                ctx.clearRect(0, 0, width, height);
                window.removeEventListener('resize', resize);
            };
            function burst(x, y) {
                for (let i = 0; i < 75; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 1.5 + Math.random() * 5;
                    particles.push({x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
                        life: 1, color: colors[i % colors.length], size: 2 + Math.random()*3});
                }
            }
            // 움직임 줄이기 설정에서는 정적인 축하 문구와 트로피를 유지합니다.
            if (reducedMotion) { stopFireworks(); return; }
            const started = performance.now();
            let previous = started;
            function animate(now) {
                const elapsed = now - started;
                const step = Math.min((now - previous) / 16.67, 2);
                previous = now;
                ctx.clearRect(0, 0, width, height);
                if (elapsed < 5000 && elapsed - lastBurst > 450) {
                    burst(width * (0.12 + Math.random()*0.76), height * (0.12 + Math.random()*0.45));
                    lastBurst = elapsed;
                }
                particles = particles.filter(p => p.life > 0);
                for (const p of particles) {
                    p.x += p.vx*step; p.y += p.vy*step; p.vy += 0.045*step; p.life -= 0.009*step;
                    ctx.globalAlpha = Math.max(p.life, 0); ctx.fillStyle = p.color;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
                }
                ctx.globalAlpha = 1;
                if (elapsed < 7500 && !document.hidden) frame = requestAnimationFrame(animate);
                else stopFireworks();
            }
            frame = requestAnimationFrame(animate);
        }
    </script>
</body>
</html>
